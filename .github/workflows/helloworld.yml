name: "Helloworld workflow"

on:
  push:
    branches: master
  workflow_dispatch:

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: "printing helloworld"
        run: echo "Hello world"

      - name: "printing java"
        run: echo "java"

      - name: "Printing current date"
        run: date

      - name: "Making folder"
        run: mkdir "Krish jain"

      - name: "Printing all folders if any"
        run: ls -la

      - name: Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: "Printing all folders if any"
        run: ls

      - name: Check Node version
        run: |
          node -v
          npm -v
          which node
